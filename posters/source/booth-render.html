      add(new THREE.CylinderGeometry(.045, .045, .14, 20), std({ color: 0xffe2a8, emissive: 0xffb45a, emissiveIntensity: 3, roughness: .1 }), [0, -.025, 0], [0, 0, 0], { parent: g, cast: false });

    }

    const key = new THREE.SpotLight(0xffc98a, 18, 0, .9, .7, 2); key.position.set(0, EAVE - .05, .9); key.target.position.set(0, .6, -.5); key.castShadow = true;

    scene.add(new THREE.HemisphereLight(0x2a3346, 0x0f1a0c, .8));

    const flood = new THREE.SpotLight(0xe8e4ff, 70, 0, .5, .8, 2); flood.position.set(4.5, 5.5, 7.5); flood.target.position.set(0, 1.2, 0); flood.castShadow = true;

    const tree = (px, pz, seed) => { const r = rng(seed), g = new THREE.Group(); g.position.set(px, 0, pz); scene.add(g);
      add(new THREE.CylinderGeometry(.16, .12, .32, 28), std({ color: 0x141414, roughness: .55 }), [0, .16, 0], [0, 0, 0], { parent: g });
      add(new THREE.CylinderGeometry(.15, .15, .01, 28), std({ color: 0x2b2018, roughness: 1 }), [0, .31, 0], [0, 0, 0], { parent: g });

      for (const [x0, y0, z0, dx, len, dz] of trunks) { const a = V(x0, y0, z0), b = V(x0 + dx, y0 + len, z0 + dz), d = new THREE.Vector3().subVectors(b, a);

        e.set(r() * 3, r() * 3, r() * 3); q.setFromEuler(e); m4.compose(V(cx + rr * Math.sin(v) * Math.cos(u), cy + rr * Math.cos(v) * .8, cz + rr * Math.sin(v) * Math.sin(u)), q, V(1, 1, 1).multiplyScalar(.8 + r() * .6));
