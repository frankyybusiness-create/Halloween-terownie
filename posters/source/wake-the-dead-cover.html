<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#222}canvas{width:540px}</style></head>
<body>
<script>
// WAKE THE DEAD, Terownie announcement B: vintage horror comic-book cover. The event pumpkin host presents Terownie as special guest.
// Inspiration: Death by Disco (one-ink newspaper grid, justified condensed type, star bullets, huge number),
// the retro Halloween grid (monochrome crowd photos, red-on-black CRT, cut-paper + photocopy grit),
// Disco Devil (halftone photos, torn strips carrying the facts).
// Event facts come from the PUMP.BOYZ × EVPHORIA flyers only.
const W = 1080, H = 1350, S = +(new URLSearchParams(location.search).get('s') || 1);
const ROOT = '../../';
const PAPER = '#E6D9BD', RED = '#B3141C', CRIM = '#6B0910', INK = '#130E0E';
const OUT = window.OUT = {};

function rng(s) { return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const load = (u) => new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => j(u); i.src = u; });
function cv(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
/** a full-poster layer in poster units (1080x1350), backed at S x resolution */
function layer(name) { const c = cv(W * S, H * S); OUT[name] = c; const x = c.getContext('2d'); x.setTransform(S, 0, 0, S, 0, 0); return x; }
function noise(w, h, cell, seed) {
  const n = cv(w / cell + 2, h / cell + 2), nc = n.getContext('2d'), id = nc.createImageData(n.width, n.height), r = rng(seed);
  for (let i = 0; i < id.data.length; i += 4) { id.data[i] = id.data[i + 1] = id.data[i + 2] = r() * 255; id.data[i + 3] = 255; }
  nc.putImageData(id, 0, 0); const o = cv(w, h), oc = o.getContext('2d'); oc.imageSmoothingQuality = 'high'; oc.drawImage(n, 0, 0, w, h);
  return oc.getImageData(0, 0, o.width, o.height).data;
}

/** One-ink halftone of a crop of `img` into a w x h box (poster units). Dark source -> big dots unless invert=false. */
function halftone(img, crop, w, h, { color = INK, spacing = 5, lo = .1, hi = .9, gamma = 1, invert = true, angle = 45, seed = 1, gain = 1 } = {}) {
  const pw = Math.round(w * S), ph = Math.round(h * S), sp = spacing * S;
  const s = cv(pw, ph), c = s.getContext('2d'); const [sx, sy, sw, sh] = crop || [0, 0, img.width, img.height];
  c.filter = `blur(${.6 * S}px)`; c.drawImage(img, sx, sy, sw, sh, 0, 0, pw, ph); c.filter = 'none';
  const d = c.getImageData(0, 0, pw, ph).data, nd = noise(pw, ph, 30 * S, seed), gr = rng(seed + 3);
  const out = cv(pw, ph), oc = out.getContext('2d'); oc.fillStyle = color; oc.beginPath();
  const t = angle * Math.PI / 180, R = Math.hypot(pw, ph);
  for (let gy = -R; gy < R; gy += sp) for (let gx = -R; gx < R; gx += sp) {
    const px = pw / 2 + gx * Math.cos(t) - gy * Math.sin(t), py = ph / 2 + gx * Math.sin(t) + gy * Math.cos(t);
    if (px < 0 || py < 0 || px >= pw || py >= ph) continue;
    const k = ((py | 0) * pw + (px | 0)) * 4, a = d[k + 3] / 255; if (a < .05) continue;
    let l = (.299 * d[k] + .587 * d[k + 1] + .114 * d[k + 2]) / 255;
    l = Math.min(1, Math.max(0, (l - lo) / (hi - lo))) ** gamma; if (invert) l = 1 - l;
    l *= (.82 + .36 * nd[k] / 255) * (.9 + gr() * .2);
    const r = sp * .7 * Math.min(1.05, Math.sqrt(l) * gain) * a; if (r < .35 * S) continue;
    oc.moveTo(px + r, py); oc.arc(px, py, r, 0, 7);
  }
  oc.fill(); return out;
}

/** Screen-print wear: knock specks and patchy under-inked areas out of a layer. */
function wear(ctx, amount, seed) {
  const c = ctx.canvas, w = c.width, h = c.height, n = noise(w, h, 1.6 * S, seed), b = noise(w, h, 70 * S, seed + 1), id = ctx.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const v = n[i] / 255, big = b[i] / 255; if (v > 1 - amount * .3 - Math.max(0, big - .62) * amount * 1.6) d[i + 3] *= .08; }
  ctx.putImageData(id, 0, 0);
}
/** Rough the edge of a fill: jittered polygon rect */
function roughRect(ctx, x, y, w, h, j, seed) {
  const r = rng(seed); ctx.beginPath(); ctx.moveTo(x + r() * j, y + r() * j);
  for (let t = 0; t <= w; t += 9) ctx.lineTo(x + t, y + (r() - .5) * j);
  for (let t = 0; t <= h; t += 9) ctx.lineTo(x + w + (r() - .5) * j, y + t);
  for (let t = w; t >= 0; t -= 9) ctx.lineTo(x + t, y + h + (r() - .5) * j);
  for (let t = h; t >= 0; t -= 9) ctx.lineTo(x + (r() - .5) * j, y + t);
  ctx.closePath();
}
/** Torn paper strip path (Disco Devil facts strips) */
function tornPath(ctx, x, y, w, h, seed) {
  const r = rng(seed); ctx.beginPath(); ctx.moveTo(x, y + r() * 6);
  for (let t = 0; t <= w; t += 7) ctx.lineTo(x + t, y + r() * 9 - 2);
  ctx.lineTo(x + w + r() * 6, y + h * .5);
  for (let t = w; t >= 0; t -= 7) ctx.lineTo(x + t, y + h - r() * 9 + 2);
  ctx.lineTo(x - r() * 6, y + h * .5); ctx.closePath();
}

/** Draw `text` so its cap height spans y..y+h and its width is exactly w (condensed type that fills its box). */
function fit(ctx, text, family, x, y, w, h, color, { track = 0 } = {}) {
  ctx.save(); ctx.font = `200px ${family}`; ctx.letterSpacing = track + 'px';
  const m = ctx.measureText(text), cap = m.actualBoundingBoxAscent, tw = m.actualBoundingBoxRight + m.actualBoundingBoxLeft;
  ctx.translate(x, y + h); ctx.scale(w / tw, h / cap); ctx.fillStyle = color; ctx.fillText(text, m.actualBoundingBoxLeft, 0); ctx.restore();
}
/** Plain text, natural proportions, optional horizontal squeeze */
function text(ctx, s, family, size, x, y, color, { align = 'left', track = 0, sx = 1, base = 'alphabetic' } = {}) {
  ctx.save(); ctx.font = `${size}px ${family}`; ctx.letterSpacing = track + 'px'; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillStyle = color;
  ctx.translate(x, y); ctx.scale(sx, 1); ctx.fillText(s, 0, 0); ctx.restore();
}
function star(ctx, x, y, r, color, inner = .42, pts = 5) {
  ctx.beginPath(); for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
function sparkle(ctx, x, y, r, color) { star(ctx, x, y, r, color, .16, 4); }

const ORANGE = '#F26A1B', YEL = '#F5C431', PURP = '#4B2470', CREAM = '#F4E7C8';
/** fitted text with a thick black comic outline */
function fitInk(ctx, s, fam, x, y, w, h, col, { track = 0, line = 6, shadow = 0 } = {}) {
  if (shadow) for (let k = 1; k <= shadow; k++) fit(ctx, s, fam, x + k, y + k, w, h, INK, { track });
  for (let a = 0; a < 16; a++) fit(ctx, s, fam, x + Math.cos(a * Math.PI / 8) * line, y + Math.sin(a * Math.PI / 8) * line, w, h, INK, { track });
  fit(ctx, s, fam, x, y, w, h, col, { track });
}
function burst(ctx, cx, cy, rx, ry, n, col, seed) { const r = rng(seed); ctx.beginPath(); for (let i = 0; i < n * 2; i++) { const a = i * Math.PI / n, k = i % 2 ? .62 : 1 + r() * .15; ctx.lineTo(cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k); } ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke(); }
function bubble(ctx, cx, cy, rx, ry, tx, ty) { ctx.fillStyle = '#FFF8E8'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill(); ctx.stroke();
  const a = Math.atan2(ty - cy, tx - cx), bx = cx + Math.cos(a) * rx * .8, by = cy + Math.sin(a) * ry * .8, n = a + Math.PI / 2;
  ctx.beginPath(); ctx.moveTo(bx + Math.cos(n) * 20, by + Math.sin(n) * 20); ctx.lineTo(tx, ty); ctx.lineTo(bx - Math.cos(n) * 20, by - Math.sin(n) * 20); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy, rx - 2, ry - 2, 0, 0, 7); ctx.fill(); }
(async () => {
  try {
    for (const [fam, file] of [['Anton', 'anton/files/anton-latin-400-normal.woff2'], ['Oswald', 'oswald/files/oswald-latin-600-normal.woff2'], ['Creep', 'creepster/files/creepster-latin-400-normal.woff2'], ['Bang', 'bangers/files/bangers-latin-400-normal.woff2']]) {
      const f = new FontFace(fam, `url(${ROOT}node_modules/@fontsource/${file})`); await f.load(); document.fonts.add(f);
    }
    const host = await load(ROOT + 'public/event/pumpkin-host-cut.png');
    const crowd = await load(ROOT + 'public/event/costume-crowd.png');
    const logo = await load(ROOT + 'public/brand/terownie-logo-cream.png');
    const M = 30, X0 = M, X1 = W - M, Y0 = M, Y1 = H - M, IW = X1 - X0;

    // ── 01 cover art: sunset sky, moon, rays, dot screen ──
    const sk = layer('01-sky');
    sk.fillStyle = '#EADBB4'; sk.fillRect(0, 0, W, H);
    sk.save(); sk.beginPath(); sk.rect(X0, Y0, IW, Y1 - Y0); sk.clip();
    let g = sk.createLinearGradient(0, Y0, 0, 1000); g.addColorStop(0, '#F7883A'); g.addColorStop(.45, '#E5402A'); g.addColorStop(.8, '#A3204A'); g.addColorStop(1, PURP); sk.fillStyle = g; sk.fillRect(0, 0, W, H);
    const MX = 760, MY = 470;
    sk.fillStyle = 'rgba(255,214,120,.22)'; for (let i = 0; i < 24; i += 2) { const a0 = i * Math.PI / 12, a1 = (i + 1) * Math.PI / 12; sk.beginPath(); sk.moveTo(MX, MY); sk.arc(MX, MY, 1400, a0, a1); sk.closePath(); sk.fill(); }
    sk.fillStyle = '#FBE3A6'; sk.beginPath(); sk.arc(MX, MY, 250, 0, 7); sk.fill();
    sk.fillStyle = 'rgba(230,170,90,.5)'; for (const [x, y, r] of [[690, 380, 40], [830, 560, 55], [860, 400, 24], [700, 600, 30]]) { sk.beginPath(); sk.arc(x, y, r, 0, 7); sk.fill(); }
    // bats
    sk.fillStyle = INK; for (const [x, y, s] of [[170, 360, 1], [260, 300, .6], [960, 300, .8], [1000, 700, .55]]) { sk.save(); sk.translate(x, y); sk.scale(s, s); sk.beginPath(); sk.moveTo(0, 0); sk.quadraticCurveTo(-30, -30, -80, -10); sk.quadraticCurveTo(-60, 0, -55, 18); sk.quadraticCurveTo(-35, 5, -20, 20); sk.quadraticCurveTo(-8, 8, 0, 18); sk.quadraticCurveTo(8, 8, 20, 20); sk.quadraticCurveTo(35, 5, 55, 18); sk.quadraticCurveTo(60, 0, 80, -10); sk.quadraticCurveTo(30, -30, 0, 0); sk.fill(); sk.restore(); }
    // dot screen
    sk.fillStyle = 'rgba(120,10,30,.22)'; sk.beginPath(); for (let y = 0; y < H; y += 7) for (let x = (y / 7 % 2) * 3.5; x < W; x += 7) { const r = 1 + 1.4 * (y / H); sk.moveTo(x + r, y); sk.arc(x, y, r, 0, 7); } sk.fill();
    sk.restore();

    // ── 02 hero: the event's pumpkin host ──
    const hr = layer('02-pumpkin-host');
    { const hw = 600, hh = hw * host.height / host.width; hr.drawImage(host, 80, 300, hw, hh); }
    // speech bubble from the host
    bubble(hr, 250, 330, 165, 70, 330, 420);
    fit(hr, 'GUESS WHO’S', 'Bang', 140, 290, 220, 30, INK, { track: 1 }); fit(hr, 'POPPING UP?', 'Bang', 128, 328, 244, 34, '#C8231B', { track: 1 });

    // ── 03 special guest card (styled like the event's DJ cards) ──
    const cd = layer('03-guest-card');
    { cd.save(); cd.translate(800, 650); cd.rotate(.09); const cw = 330, ch = 420;
      cd.fillStyle = 'rgba(0,0,0,.35)'; cd.fillRect(-cw / 2 + 12, -ch / 2 + 14, cw, ch);
      cd.fillStyle = CREAM; cd.fillRect(-cw / 2, -ch / 2, cw, ch); cd.lineWidth = 5; cd.strokeStyle = INK; cd.strokeRect(-cw / 2, -ch / 2, cw, ch);
      cd.fillStyle = INK; cd.fillRect(-cw / 2 + 18, -ch / 2 + 46, cw - 36, 270);
      cd.fillStyle = 'rgba(255,255,255,.05)'; for (let y = -ch / 2 + 50; y < -ch / 2 + 312; y += 7) for (let x = -cw / 2 + 22; x < cw / 2 - 18; x += 7) { cd.beginPath(); cd.arc(x, y, 1.5, 0, 7); cd.fill(); }
      fit(cd, '★', 'Oswald', -14, -ch / 2 + 12, 28, 24, '#C8231B');
      const lw = cw - 76, lh = lw * logo.height / logo.width; cd.drawImage(logo, -lw / 2, -ch / 2 + 46 + (270 - lh) / 2, lw, lh);
      fit(cd, 'SIP AND KILL', 'Bang', -cw / 2 + 40, ch / 2 - 88, cw - 80, 40, INK, { track: 3 });
      fit(cd, 'HALLOWEEN POP-UP', 'Bang', -cw / 2 + 70, ch / 2 - 38, cw - 140, 18, '#C8231B', { track: 2 });
      cd.restore(); }
    burst(cd, 905, 420, 135, 82, 14, YEL, 7);
    cd.save(); cd.translate(905, 420); cd.rotate(.12); fit(cd, 'SPECIAL', 'Bang', -70, -34, 140, 30, INK, { track: 2 }); fit(cd, 'GUEST!', 'Bang', -64, 4, 128, 32, '#C8231B', { track: 2 }); cd.restore();
    fitInk(cd, 'WILL BE THERE!', 'Creep', 590, 880, 420, 58, YEL, { track: 2, line: 4, shadow: 6 });

    // ── 04 crowd panel at the bottom: the event's shocked costume crowd looking up ──
    const cr = layer('04-crowd-panel');
    const CY = 948, CH = 180;
    cr.save(); cr.translate(W / 2, CY + CH / 2); cr.rotate(-.025);
    cr.fillStyle = INK; cr.fillRect(-IW / 2 - 6, -CH / 2 - 6, IW + 12, CH + 12);
    const sh = crowd.width * CH / IW; cr.drawImage(crowd, 0, crowd.height * .1, crowd.width, sh, -IW / 2, -CH / 2, IW, CH);
    cr.restore();
    bubble(cr, 900, 990, 136, 48, 830, 1050);
    fit(cr, 'IS THAT... TEROWNIE?!', 'Bang', 788, 977, 224, 28, INK, { track: 1 });

    // ── 05 masthead + footer ──
    const mh = layer('05-masthead');
    mh.fillStyle = INK; mh.fillRect(X0, Y0, IW, 46);
    fit(mh, 'PUMP.BOYZ × EVPHORIA PRESENT', 'Bang', X0 + 180, Y0 + 11, IW - 360, 24, CREAM, { track: 4 });
    // issue box (comic cover corner)
    mh.fillStyle = YEL; mh.fillRect(X0 + 14, Y0 + 58, 120, 120); mh.lineWidth = 4; mh.strokeStyle = INK; mh.strokeRect(X0 + 14, Y0 + 58, 120, 120);
    fit(mh, 'No.', 'Bang', X0 + 30, Y0 + 70, 34, 18, INK); fit(mh, '30', 'Bang', X0 + 30, Y0 + 94, 88, 52, INK); fit(mh, 'OCT', 'Bang', X0 + 46, Y0 + 152, 56, 18, '#C8231B', { track: 2 });
    fitInk(mh, 'WAKE THE DEAD', 'Creep', X0 + 156, Y0 + 70, IW - 176, 120, ORANGE, { track: 3, line: 7, shadow: 9 });
    fitInk(mh, 'HOUSE PARTY — HALLOWEEN SPECIAL', 'Bang', X0 + 220, Y0 + 210, IW - 300, 28, CREAM, { track: 4, line: 3 });
    // footer: date (drippy red) + venue box (orange), like the event flyer
    const FY = 1148;
    fitInk(mh, 'DOORS OPEN AT 3PM', 'Bang', X0 + 24, FY, 250, 26, YEL, { track: 2, line: 3 });
    fitInk(mh, 'FRIDAY THE 30TH', 'Creep', X0 + 24, FY + 36, 470, 60, '#E8402E', { track: 2, line: 4, shadow: 5 });
    fitInk(mh, 'OF OCTOBER', 'Creep', X0 + 270, FY + 112, 224, 28, '#E8402E', { track: 2, line: 3 });
    mh.save(); mh.translate(800, FY + 78); mh.rotate(-.02); mh.fillStyle = ORANGE; roughRect(mh, -230, -66, 460, 132, 5, 4); mh.fill(); mh.lineWidth = 5; mh.strokeStyle = INK; mh.stroke();
    fit(mh, 'TWIN-PEAKS', 'Creep', -196, -52, 392, 40, '#FFF1D6', { track: 2 }); fit(mh, 'MOUNTAIN', 'Creep', -150, -4, 300, 34, '#FFF1D6', { track: 2 });
    fit(mh, 'BRGY. DAPDAP, TAYABAS CITY', 'Bang', -190, 40, 380, 18, INK, { track: 2 }); mh.restore();
    // cover frame
    mh.lineWidth = 6; mh.strokeStyle = INK; mh.strokeRect(X0, Y0, IW, Y1 - Y0);

    // ── 06 print finish ──
    const gx = layer('06-grain');
    { const c = gx.canvas, id = gx.createImageData(c.width, c.height), r = rng(9);
      for (let i = 0; i < c.width * c.height; i++) { const v = 128 + (r() + r() + r() - 1.5) * 64; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; } gx.putImageData(id, 0, 0); }
    const pt = layer('07-paper-wear');
    { const r = rng(12); pt.strokeStyle = 'rgba(234,219,180,.35)'; pt.lineWidth = .9; for (let i = 0; i < 40; i++) { const x = r() * W, y = r() * H; pt.beginPath(); pt.moveTo(x, y); pt.lineTo(x + (r() - .5) * 120, y + (r() - .5) * 20); pt.stroke(); }
      pt.fillStyle = 'rgba(234,219,180,.55)'; for (let i = 0; i < 3000; i++) pt.fillRect(r() * W, r() * H, 1 + r() * 2, 1 + r() * 2);
      g = pt.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * .8); g.addColorStop(0, 'rgba(90,55,20,0)'); g.addColorStop(1, 'rgba(90,55,20,.35)'); pt.fillStyle = g; pt.fillRect(0, 0, W, H); }
    wear(mh, .08, 3);

    const fin = layer('poster'); fin.setTransform(1, 0, 0, 1, 0, 0);
    for (const k of ['01-sky', '02-pumpkin-host', '04-crowd-panel', '03-guest-card', '05-masthead']) fin.drawImage(OUT[k], 0, 0);
    fin.globalCompositeOperation = 'overlay'; fin.globalAlpha = .45; fin.drawImage(OUT['06-grain'], 0, 0);
    fin.globalCompositeOperation = 'source-over'; fin.globalAlpha = 1; fin.drawImage(OUT['07-paper-wear'], 0, 0);
    document.body.appendChild(OUT.poster);
    document.title = 'ready';
  } catch (e) { console.log(e && e.stack || e); document.title = 'error ' + e; }
})();
</script></body></html>
