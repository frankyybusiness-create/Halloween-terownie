<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'AN';src:url('../../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2')}
html,body{margin:0;background:transparent}
#p{position:relative;overflow:hidden;width:1080px;height:1350px;background:#2457E6}
#p>*{position:absolute;left:0;top:0}
</style></head>
<body><div id="p"></div>
<script src="lib.js"></script>
<script>
// "Death by Disco" one-ink newspaper layout · event imagery · Terownie pop-up
const PAPER='#2457E6', INK='#0B0B14';
const M=30;
(async()=>{
  await fonts(["40px AN"]);
  const host=await load(ROOT+'public/brand/terownie-ghost.png');
  const crowd=await load(ROOT+'public/event/costume-crowd.png');
  const house=await load(ROOT+'public/event/party-house.png');
  const cup=await load(ROOT+'public/drinks/dirty-matcha.png');
  const logoSrc=await load(ROOT+'public/brand/terownie-logo-black.png');

  // all artwork + rules are printed in ONE ink on the blue paper
  const ink=layer('01-ink-artwork',1);
  ink.fillStyle=INK;
  const rect=(x,y,w,h,lw)=>{ink.lineWidth=lw;ink.strokeStyle=INK;ink.strokeRect(x,y,w,h)};
  const hr=(x,y,w,lw=6)=>ink.fillRect(x,y,w,lw);
  rect(M,M,W-2*M,H-2*M,10); rect(M+14,M+14,W-2*M-28,H-2*M-28,3);
  // header rule + stars
  hr(M+14,404,W-2*M-28,8);
  // hero: pumpkin host in the headline box (right), halftoned dark-on-blue
  halftone(ink,host,730,50,290,343,{color:INK,spacing:5.5,gain:.95,invert:true,light:.2,lx:.4,ly:.3,seed:4});
  // left photo panel: the event's costume crowd
  const PX=M+14,PY=418,PW=430,PH=400;
  ink.save();ink.beginPath();ink.rect(PX,PY,PW,PH);ink.clip();
  halftone(ink,crowd,PX-200,PY,PW+380,PH+10,{color:INK,spacing:5,gain:.8,invert:true,light:0,seed:7});
  ink.restore(); rect(PX,PY,PW,PH,8);
  // fact column rules
  const FX=PX+PW+16,FW=W-M-14-FX;
  hr(FX,510,FW,5); hr(FX,600,FW,5);
  ink.fillRect(FX+250,614,4,196);
  // bottom band: the party house + the real drink
  const BY=832,BH=H-M-14-BY;
  ink.save();ink.beginPath();ink.rect(PX,BY,W-2*M-28,BH);ink.clip();
  halftone(ink,house,PX-40,BY-120,1100,760,{color:INK,spacing:5.5,gain:.75,invert:true,light:0,seed:11});
  ink.restore();
  ink.save();ink.translate(860,1010);ink.rotate(.06);
  const cupInk=canvas(260,360);const cc=cupInk.getContext('2d');cc.fillStyle=PAPER;cc.save();cc.beginPath();cc.moveTo(14,10);cc.lineTo(246,10);cc.lineTo(214,352);cc.lineTo(46,352);cc.closePath();cc.fill();cc.restore();halftone(cc,cup,0,0,260,360,{color:INK,spacing:4.5,gain:1.1,invert:true,light:0,seed:13});
  ink.drawImage(cupInk,-130,-180);ink.restore();
  rect(PX,BY,W-2*M-28,BH,8);
  inkWear(ink,.3,21);
  ink.fillStyle=PAPER;ink.fillRect(PX+24,BY+BH-176,300,152);ink.lineWidth=5;ink.strokeStyle=INK;ink.strokeRect(PX+24,BY+BH-176,300,152);ink.drawImage(logoSrc,PX+54,BY+BH-166,240,240*logoSrc.height/logoSrc.width);

  // type, also one-ink and worn
  const T=(name,css,html)=>div(name,5,`font-family:AN;color:${INK};line-height:.86;white-space:nowrap;`+css,html);
  T('02-kicker',`left:${M+30}px;top:${M+22}px;font-size:22px;letter-spacing:.24em`,'★ PUMP.BOYZ × EVPHORIA · HOUSE PARTY — HALLOWEEN SPECIAL ★');
  T('02-headline',`left:${M+26}px;top:84px;font-size:168px;letter-spacing:-2px;transform:scaleY(1.12);transform-origin:top left`,'SIP AND<br>KILL');
  T('02-headline-sub',`left:380px;top:250px;font-size:44px;line-height:1`,'A HALLOWEEN<br>POP-UP BY<br>TEROWNIE');
  T('03-date',`left:${FX}px;top:428px;width:${FW}px;font-size:72px;text-align:center`,'10.30 ★ 3PM');
  T('03-venue',`left:${FX}px;top:524px;width:${FW}px;font-size:62px;text-align:center`,'TWIN-PEAKS MOUNTAIN');
  T('03-big',`left:${FX}px;top:618px;width:240px;font-size:170px;text-align:center`,'FRI');
  T('03-big-label',`left:${FX}px;top:772px;width:240px;font-size:26px;text-align:center`,'DOORS OPEN AT 3 PM');
  T('03-list',`left:${FX+268}px;top:620px;font-size:28px;line-height:1.24`,"AT THE BOOTH:<br>★ STRAWBERRY MATCHA<br>★ TARO CLOUD<br>★ DIRTY MATCHA<br>★ BISCOFF SEA SALT");
  T('04-band-text',`left:${PX+344}px;top:${BY+BH-160}px;font-size:34px;line-height:1.08;color:${INK}`,`<div style="display:inline-block;background:${PAPER};padding:6px 12px">BRGY. DAPDAP, TAYABAS CITY</div><br><div style="display:inline-block;background:${PAPER};padding:6px 12px;margin-top:6px">@TEROWNIE_CAFE</div>`);
  T('04-band-cta',`left:${PX+24}px;top:${BY+22}px;font-size:58px;line-height:.95`,`<span style="background:${PAPER};padding:0 10px">PULL UP TO THE BOOTH.</span>`);

  retroFinish(20,.9);
  document.title='ready';
})();
</script></body></html>
