<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#222}canvas{width:540px}</style></head>
<body>
<script>
// WAKE THE DEAD, Terownie pop-up poster C: retro CRT TV (Halloween Retro Party), Fright Night serif title, Disco Devil pop-up lockup, red-flyer sparkles + stamps.
// Inspiration: Death by Disco (one-ink newspaper grid, justified condensed type, star bullets, huge number),
// the retro Halloween grid (monochrome crowd photos, red-on-black CRT, cut-paper + photocopy grit),
// Disco Devil (halftone photos, torn strips carrying the facts).
// Event facts come from the PUMP.BOYZ × EVPHORIA flyers only.
const W = 1080, H = 1350, S = +(new URLSearchParams(location.search).get('s') || 1);
const ROOT = '../../';
const PAPER = '#E6D9BD', RED = '#B3141C', CRIM = '#6B0910', INK = '#130E0E';
const OUT = window.OUT = {};

function rng(s) { return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const load = (u) => new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => j(u); i.src = u; });
function cv(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
/** a full-poster layer in poster units (1080x1350), backed at S x resolution */
function layer(name) { const c = cv(W * S, H * S); OUT[name] = c; const x = c.getContext('2d'); x.setTransform(S, 0, 0, S, 0, 0); return x; }
function noise(w, h, cell, seed) {
  const n = cv(w / cell + 2, h / cell + 2), nc = n.getContext('2d'), id = nc.createImageData(n.width, n.height), r = rng(seed);
  for (let i = 0; i < id.data.length; i += 4) { id.data[i] = id.data[i + 1] = id.data[i + 2] = r() * 255; id.data[i + 3] = 255; }
  nc.putImageData(id, 0, 0); const o = cv(w, h), oc = o.getContext('2d'); oc.imageSmoothingQuality = 'high'; oc.drawImage(n, 0, 0, w, h);
  return oc.getImageData(0, 0, o.width, o.height).data;
}

/** One-ink halftone of a crop of `img` into a w x h box (poster units). Dark source -> big dots unless invert=false. */
function halftone(img, crop, w, h, { color = INK, spacing = 5, lo = .1, hi = .9, gamma = 1, invert = true, angle = 45, seed = 1, gain = 1 } = {}) {
  const pw = Math.round(w * S), ph = Math.round(h * S), sp = spacing * S;
  const s = cv(pw, ph), c = s.getContext('2d'); const [sx, sy, sw, sh] = crop || [0, 0, img.width, img.height];
  c.filter = `blur(${.6 * S}px)`; c.drawImage(img, sx, sy, sw, sh, 0, 0, pw, ph); c.filter = 'none';
  const d = c.getImageData(0, 0, pw, ph).data, nd = noise(pw, ph, 30 * S, seed), gr = rng(seed + 3);
  const out = cv(pw, ph), oc = out.getContext('2d'); oc.fillStyle = color; oc.beginPath();
  const t = angle * Math.PI / 180, R = Math.hypot(pw, ph);
  for (let gy = -R; gy < R; gy += sp) for (let gx = -R; gx < R; gx += sp) {
    const px = pw / 2 + gx * Math.cos(t) - gy * Math.sin(t), py = ph / 2 + gx * Math.sin(t) + gy * Math.cos(t);
    if (px < 0 || py < 0 || px >= pw || py >= ph) continue;
    const k = ((py | 0) * pw + (px | 0)) * 4, a = d[k + 3] / 255; if (a < .05) continue;
    let l = (.299 * d[k] + .587 * d[k + 1] + .114 * d[k + 2]) / 255;
    l = Math.min(1, Math.max(0, (l - lo) / (hi - lo))) ** gamma; if (invert) l = 1 - l;
    l *= (.82 + .36 * nd[k] / 255) * (.9 + gr() * .2);
    const r = sp * .7 * Math.min(1.05, Math.sqrt(l) * gain) * a; if (r < .35 * S) continue;
    oc.moveTo(px + r, py); oc.arc(px, py, r, 0, 7);
  }
  oc.fill(); return out;
}

/** Screen-print wear: knock specks and patchy under-inked areas out of a layer. */
function wear(ctx, amount, seed) {
  const c = ctx.canvas, w = c.width, h = c.height, n = noise(w, h, 1.6 * S, seed), b = noise(w, h, 70 * S, seed + 1), id = ctx.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const v = n[i] / 255, big = b[i] / 255; if (v > 1 - amount * .3 - Math.max(0, big - .62) * amount * 1.6) d[i + 3] *= .08; }
  ctx.putImageData(id, 0, 0);
}
/** Rough the edge of a fill: jittered polygon rect */
function roughRect(ctx, x, y, w, h, j, seed) {
  const r = rng(seed); ctx.beginPath(); ctx.moveTo(x + r() * j, y + r() * j);
  for (let t = 0; t <= w; t += 9) ctx.lineTo(x + t, y + (r() - .5) * j);
  for (let t = 0; t <= h; t += 9) ctx.lineTo(x + w + (r() - .5) * j, y + t);
  for (let t = w; t >= 0; t -= 9) ctx.lineTo(x + t, y + h + (r() - .5) * j);
  for (let t = h; t >= 0; t -= 9) ctx.lineTo(x + (r() - .5) * j, y + t);
  ctx.closePath();
}
/** Torn paper strip path (Disco Devil facts strips) */
function tornPath(ctx, x, y, w, h, seed) {
  const r = rng(seed); ctx.beginPath(); ctx.moveTo(x, y + r() * 6);
  for (let t = 0; t <= w; t += 7) ctx.lineTo(x + t, y + r() * 9 - 2);
  ctx.lineTo(x + w + r() * 6, y + h * .5);
  for (let t = w; t >= 0; t -= 7) ctx.lineTo(x + t, y + h - r() * 9 + 2);
  ctx.lineTo(x - r() * 6, y + h * .5); ctx.closePath();
}

/** Draw `text` so its cap height spans y..y+h and its width is exactly w (condensed type that fills its box). */
function fit(ctx, text, family, x, y, w, h, color, { track = 0 } = {}) {
  ctx.save(); ctx.font = `200px ${family}`; ctx.letterSpacing = track + 'px';
  const m = ctx.measureText(text), cap = m.actualBoundingBoxAscent, tw = m.actualBoundingBoxRight + m.actualBoundingBoxLeft;
  ctx.translate(x, y + h); ctx.scale(w / tw, h / cap); ctx.fillStyle = color; ctx.fillText(text, m.actualBoundingBoxLeft, 0); ctx.restore();
}
/** Plain text, natural proportions, optional horizontal squeeze */
function text(ctx, s, family, size, x, y, color, { align = 'left', track = 0, sx = 1, base = 'alphabetic' } = {}) {
  ctx.save(); ctx.font = `${size}px ${family}`; ctx.letterSpacing = track + 'px'; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillStyle = color;
  ctx.translate(x, y); ctx.scale(sx, 1); ctx.fillText(s, 0, 0); ctx.restore();
}
function star(ctx, x, y, r, color, inner = .42, pts = 5) {
  ctx.beginPath(); for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
function sparkle(ctx, x, y, r, color) { star(ctx, x, y, r, color, .16, 4); }

const BG = '#141011', CRM = '#EFE3CA', RD = '#D3242C', ORNG = '#F5921E';
(async () => {
  try {
    for (const [fam, file] of [['Play', 'playfair-display/files/playfair-display-latin-500-normal.woff2'], ['Mont', 'montserrat/files/montserrat-latin-500-normal.woff2'], ['MontB', 'montserrat/files/montserrat-latin-700-normal.woff2'], ['Anton', 'anton/files/anton-latin-400-normal.woff2'], ['Oswald', 'oswald/files/oswald-latin-600-normal.woff2']]) {
      const f = new FontFace(fam, `url(${ROOT}node_modules/@fontsource/${file})`); await f.load(); document.fonts.add(f);
    }
    const host = await load(ROOT + 'public/event/pumpkin-host.png');
    const crowd = await load(ROOT + 'public/event/costume-crowd.png');
    const logo = await load(ROOT + 'public/brand/terownie-logo-cream.png');

    // ── 01 background: charcoal, red glow, faint red halftone crowd (Fright Night), dot grid ──
    const bg = layer('01-background');
    bg.fillStyle = BG; bg.fillRect(0, 0, W, H);
    { // one cover-fit crowd image (no tiling seam): red dots + a faint colour wash
      const cw = crowd.height * W / H, crop = [(crowd.width - cw) / 2, 0, cw, crowd.height];
      const c = halftone(crowd, crop, W, H, { color: '#5E1216', spacing: 7, lo: .1, hi: .9, invert: false, gain: 1, seed: 2 });
      bg.globalAlpha = .55; bg.drawImage(c, 0, 0, W, H);
      bg.globalAlpha = .13; bg.filter = 'saturate(1.4)'; bg.drawImage(crowd, ...crop, 0, 0, W, H); bg.filter = 'none'; bg.globalAlpha = 1; }
    let g = bg.createRadialGradient(540, 620, 60, 540, 620, 620); g.addColorStop(0, 'rgba(211,36,44,.38)'); g.addColorStop(1, 'rgba(211,36,44,0)'); bg.fillStyle = g; bg.fillRect(0, 0, W, H);
    g = bg.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(20,16,17,.85)'); g.addColorStop(.25, 'rgba(20,16,17,.2)'); g.addColorStop(.75, 'rgba(20,16,17,.25)'); g.addColorStop(1, 'rgba(20,16,17,.9)'); bg.fillStyle = g; bg.fillRect(0, 0, W, H);
    bg.fillStyle = 'rgba(0,0,0,.35)'; for (let y = 0; y < H; y += 6) for (let x = 0; x < W; x += 6) { bg.fillRect(x, y, 2.2, 2.2); }

    // ── 02 red dot halo behind the TV (Halloween Retro Party) ──
    const TVX = 540, TVY = 640;
    const ha = layer('02-dot-halo');
    { const r = rng(4); ha.fillStyle = '#' + (new URLSearchParams(location.search).get('halo') || 'D3242C'); ha.beginPath();
      for (let y = TVY - 330; y < TVY + 330; y += 11) for (let x = TVX - 420; x < TVX + 420; x += 11) { const d = Math.hypot((x - TVX) / 400, (y - TVY) / 300); if (d > 1.05 || d < .55) continue; const rr = 4.6 * (1 - Math.abs(d - .82) / .25) * (.8 + r() * .4); if (rr > .6) { ha.moveTo(x + rr, y); ha.arc(x, y, rr, 0, 7); } }
      ha.fill(); }

    // ── 03 the retro TV ──
    const tv = layer('03-tv');
    const BW = 560, BH = 420, BX = TVX - BW / 2 - 20, BY = TVY - BH / 2;
    // antenna
    tv.strokeStyle = '#2A2224'; tv.lineWidth = 6; tv.lineCap = 'round';
    tv.beginPath(); tv.moveTo(TVX - 10, BY + 4); tv.lineTo(TVX - 150, BY - 150); tv.moveTo(TVX + 10, BY + 4); tv.lineTo(TVX + 120, BY - 165); tv.stroke();
    tv.fillStyle = '#2A2224'; tv.beginPath(); tv.ellipse(TVX, BY + 6, 46, 20, 0, Math.PI, 0); tv.fill();
    // body: red cabinet with black inner bezel
    const rr = (x, y, w, h, r) => { tv.beginPath(); tv.roundRect(x, y, w, h, r); };
    tv.fillStyle = 'rgba(0,0,0,.5)'; rr(BX + 14, BY + 18, BW + 40, BH, 34); tv.fill();
    g = tv.createLinearGradient(0, BY, 0, BY + BH); g.addColorStop(0, '#E0333A'); g.addColorStop(1, '#9E151C'); tv.fillStyle = g; rr(BX, BY, BW + 40, BH, 34); tv.fill();
    tv.lineWidth = 5; tv.strokeStyle = '#1A1314'; tv.stroke();
    tv.fillStyle = '#1A1314'; rr(BX + 22, BY + 22, BW - 110, BH - 44, 26); tv.fill();
    // side panel: dial + knobs + speaker
    const PX = BX + BW - 72;
    tv.fillStyle = '#231B1C'; rr(PX, BY + 30, 92, BH - 60, 14); tv.fill();
    for (const [y, r] of [[BY + 82, 26], [BY + 160, 20]]) { tv.fillStyle = '#B9AE9C'; tv.beginPath(); tv.arc(PX + 46, y, r, 0, 7); tv.fill(); tv.strokeStyle = '#1A1314'; tv.lineWidth = 3; tv.beginPath(); tv.moveTo(PX + 46, y); tv.lineTo(PX + 46 + r * .7, y - r * .7); tv.stroke(); }
    tv.fillStyle = '#0E0A0B'; for (let i = 0; i < 9; i++) tv.fillRect(PX + 18, BY + 210 + i * 16, 56, 6);
    // screen
    const SX = BX + 44, SY = BY + 44, SW = BW - 154, SH = BH - 88;
    tv.save(); rr(SX, SY, SW, SH, 40); tv.clip();
    tv.fillStyle = '#2B0507'; tv.fillRect(SX, SY, SW, SH);
    { // full-colour host so the character pops, with a little CRT colour bleed
      const cw = host.width - 80, chh = cw * SH / SW;
      tv.save(); tv.filter = 'saturate(1.55) contrast(1.18) brightness(1.08)'; tv.drawImage(host, 40, 0, cw, chh, SX, SY, SW, SH);
      tv.globalCompositeOperation = 'screen'; tv.globalAlpha = .22; tv.filter = 'blur(2px)'; tv.drawImage(host, 40, 0, cw, chh, SX + 4, SY, SW, SH); tv.restore();
      // fine RGB dot mask
      tv.fillStyle = 'rgba(0,0,0,.18)'; for (let x = SX; x < SX + SW; x += 3) tv.fillRect(x, SY, 1, SH); }
    tv.fillStyle = 'rgba(0,0,0,.28)'; for (let y = SY; y < SY + SH; y += 4) tv.fillRect(SX, y, SW, 1.6);
    g = tv.createRadialGradient(SX + SW / 2, SY + SH / 2, SH * .2, SX + SW / 2, SY + SH / 2, SW * .7); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); tv.fillStyle = g; tv.fillRect(SX, SY, SW, SH);
    g = tv.createLinearGradient(SX, SY, SX + SW * .6, SY + SH * .6); g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(.5, 'rgba(255,255,255,0)'); tv.fillStyle = g; tv.fillRect(SX, SY, SW, SH);
    tv.restore();
    // legs
    tv.fillStyle = '#1A1314'; tv.fillRect(BX + 70, BY + BH, 22, 30); tv.fillRect(BX + BW - 50, BY + BH, 22, 30);
    wear(tv, .08, 9);

    // ── 04 type ──
    const ty = layer('04-type');
    text(ty, 'P U M P . B O Y Z   ×   E V P H O R I A   P R E S E N T', 'Mont', 17, W / 2, 70, CRM, { align: 'center', track: 2 });
    fit(ty, 'WAKE THE DEAD', 'Play', 70, 96, 940, 160, CRM, { track: 1 });
    text(ty, 'H O U S E   P A R T Y   —   H A L L O W E E N   S P E C I A L', 'MontB', 22, W / 2, 305, '#EE3B42', { align: 'center', track: 3 });
    // corner stamp (red flyer)
    ty.save(); ty.translate(925, 400); ty.rotate(-.08); text(ty, '30', 'Anton', 64, 0, 0, CRM, { align: 'center' }); text(ty, 'OCT', 'Anton', 34, 0, 36, CRM, { align: 'center', track: 4 }); ty.restore();
    for (const [x, y] of [[110, 380], [140, 380], [170, 380]]) star(ty, x, y, 10, CRM);
    // Disco Devil lockup
    text(ty, 'A   H A L L O W E E N   P O P - U P   B Y', 'Mont', 24, W / 2, 935, CRM, { align: 'center', track: 2 });
    { const lw = 290, lh = lw * logo.height / logo.width; ty.drawImage(logo, (W - lw) / 2, 958, lw, lh); }
    // torn red strip
    ty.save(); ty.translate(W / 2, 1152); ty.rotate(-.015); tornPath(ty, -230, -34, 460, 68, 21); ty.fillStyle = '#A8121A'; ty.fill();
    fit(ty, 'SIP AND KILL', 'MontB', -150, -16, 300, 32, CRM, { track: 8 }); ty.restore();
    wear(ty, .12, 14);

    // ── 05 info bar with dividers + hand-drawn circle (Retro Party + red flyer) ──
    const ib = layer('05-info-bar');
    const IY = 1212;
    ib.fillStyle = 'rgba(239,227,202,.55)'; ib.fillRect(60, IY - 14, W - 120, 2);
    fit(ib, '30', 'Anton', 76, IY + 6, 74, 74, RD);
    text(ib, 'OCTOBER', 'MontB', 17, 162, IY + 36, CRM, { track: 2 }); text(ib, 'FRIDAY', 'MontB', 17, 162, IY + 60, CRM, { track: 2 });
    ib.fillStyle = CRM; ib.fillRect(292, IY + 4, 3, 80);
    text(ib, 'DOORS OPEN', 'MontB', 15, 318, IY + 30, CRM, { track: 2 }); fit(ib, '3PM', 'Anton', 318, IY + 40, 86, 44, RD);
    ib.fillRect(462, IY + 4, 3, 80);
    fit(ib, 'TWIN-PEAKS MOUNTAIN', 'Anton', 537, IY + 12, 420, 42, CRM, { track: 2 });
    text(ib, 'BRGY. DAPDAP, TAYABAS CITY', 'MontB', 17, 747, IY + 84, CRM, { align: 'center', track: 3 });
    // hand-drawn ellipse around the venue
    ib.strokeStyle = RD; ib.lineWidth = 3.5; ib.lineCap = 'round'; ib.beginPath();
    for (let t = -.2; t <= Math.PI * 2 + .35; t += .05) { const x = 747 + Math.cos(t) * (268 + Math.sin(t * 3) * 6), y = IY + 50 + Math.sin(t) * (66 + t * 1.6); t === -.2 ? ib.moveTo(x, y) : ib.lineTo(x, y); } ib.stroke();
    wear(ib, .1, 15);

    // ── 06 sparkles (distressed, red flyer) ──
    const sp = layer('06-sparkles');
    for (const [x, y, r, c] of [[150, 560, 54, '#B51C24'], [960, 700, 40, '#B51C24'], [1010, 340, 22, CRM], [200, 860, 22, CRM], [990, 1060, 30, '#B51C24'], [90, 1080, 34, '#B51C24'], [620, 395, 14, CRM]]) sparkle(sp, x, y, r, c);
    wear(sp, .3, 16);

    // ── 07 grain + scratches ──
    const gx = layer('07-grain');
    { const c = gx.canvas, id = gx.createImageData(c.width, c.height), r = rng(9);
      for (let i = 0; i < c.width * c.height; i++) { const v = 128 + (r() + r() + r() - 1.5) * 70; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; } gx.putImageData(id, 0, 0); }
    const sc = layer('08-scratches');
    { const r = rng(31); sc.strokeStyle = 'rgba(239,227,202,.18)'; sc.lineWidth = .8; for (let i = 0; i < 30; i++) { const x = r() * W, y = r() * H; sc.beginPath(); sc.moveTo(x, y); sc.quadraticCurveTo(x + (r() - .5) * 40, y + 40, x + (r() - .5) * 30, y + 80 + r() * 160); sc.stroke(); }
      sc.fillStyle = 'rgba(239,227,202,.3)'; for (let i = 0; i < 500; i++) { sc.beginPath(); sc.arc(r() * W, r() * H, r() * 1.3, 0, 7); sc.fill(); } }

    const fin = layer('poster'); fin.setTransform(1, 0, 0, 1, 0, 0);
    for (const k of ['01-background', '02-dot-halo', '06-sparkles', '03-tv', '04-type', '05-info-bar']) fin.drawImage(OUT[k], 0, 0);
    fin.globalCompositeOperation = 'overlay'; fin.globalAlpha = .5; fin.drawImage(OUT['07-grain'], 0, 0);
    fin.globalCompositeOperation = 'source-over'; fin.globalAlpha = 1; fin.drawImage(OUT['08-scratches'], 0, 0);
    document.body.appendChild(OUT.poster);
    document.title = 'ready';
  } catch (e) { console.log(e && e.stack || e); document.title = 'error ' + e; }
})();
</script></body></html>
